# V1.1 CI Pipeline
# 2026-08-22：GitHub Actions

name: CI

on:
  push:
    branches: [main, planting-management, develop]
  pull_request:
    branches: [main, planting-management, develop]

jobs:
  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install server deps
        working-directory: ./server
        run: npm ci

      - name: Install frontend deps
        run: npm ci

      - name: TypeScript check (server)
        working-directory: ./server
        run: npx tsc --noEmit

      - name: ESLint (frontend)
        run: npm run lint 2>/dev/null || echo "ESLint skipped"

  test:
    name: UAT + Load Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint-and-typecheck

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install server deps
        working-directory: ./server
        run: npm ci

      - name: Start server
        working-directory: ./server
        run: |
          npx tsx scripts/ai-data-assessment.ts || true
          npx tsx scripts/run-migration-2026-08-22.ts || true
          nohup npm run dev &
          sleep 30

      - name: Run UAT
        working-directory: ./server
        run: python tools/ml/uat_ai_endpoints.py || true

      - name: Run load test
        working-directory: ./server
        run: python tools/ml/load_test_ai_endpoints.py || true

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build server
        working-directory: ./server
        run: npm run build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            dist/
            server/dist/
          retention-days: 7
