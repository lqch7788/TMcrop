<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700">
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="960" height="700" fill="#ffffff"/>

  <!-- Title -->
  <text x="480" y="40" text-anchor="middle" font-size="20" font-weight="600" fill="#111827">种植管理系统 - 仓库领料 RAG 架构</text>

  <!-- ============ INPUT LAYER ============ -->
  <text x="40" y="80" font-size="12" font-weight="600" fill="#6b7280">01 // 输入层</text>

  <!-- User -->
  <g transform="translate(80, 100)">
    <circle cx="40" cy="30" r="20" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="40" y="35" text-anchor="middle" font-size="12" fill="#2563eb">用户</text>
    <rect x="0" y="60" width="80" height="40" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="40" y="85" text-anchor="middle" font-size="11" fill="#111827">领料申请</text>
  </g>

  <!-- ============ RETRIEVAL LAYER ============ -->
  <text x="40" y="230" font-size="12" font-weight="600" fill="#6b7280">02 // 检索层</text>

  <!-- Query Processor -->
  <g transform="translate(250, 200)">
    <rect x="0" y="0" width="100" height="50" rx="8" fill="#faf5ff" stroke="#9333ea" stroke-width="1.5"/>
    <text x="50" y="20" text-anchor="middle" font-size="12" font-weight="500" fill="#111827">Query</text>
    <text x="50" y="38" text-anchor="middle" font-size="10" fill="#6b7280">查询处理器</text>
  </g>

  <!-- Embedding Model -->
  <g transform="translate(250, 280)">
    <rect x="0" y="0" width="100" height="50" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="50" y="20" text-anchor="middle" font-size="12" font-weight="500" fill="#111827">Embedding</text>
    <text x="50" y="38" text-anchor="middle" font-size="10" fill="#6b7280">向量化模型</text>
  </g>

  <!-- Vector Store -->
  <g transform="translate(250, 360)">
    <path d="M20,0 L80,0 L80,45 L20,45 Z" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <path d="M20,0 Q20,15 50,15 Q80,15 80,0" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <path d="M20,15 Q20,30 50,30 Q80,30 80,15" fill="none" stroke="#16a34a" stroke-width="1"/>
    <path d="M20,30 Q20,45 50,45 Q80,45 80,30" fill="none" stroke="#16a34a" stroke-width="1"/>
    <text x="50" y="65" text-anchor="middle" font-size="11" fill="#111827">库存向量库</text>
  </g>

  <!-- Inventory KB -->
  <g transform="translate(380, 360)">
    <rect x="0" y="0" width="120" height="50" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="60" y="20" text-anchor="middle" font-size="12" font-weight="500" fill="#111827">Inventory KB</text>
    <text x="60" y="38" text-anchor="middle" font-size="10" fill="#6b7280">库存知识库</text>
  </g>

  <!-- ============ PROCESSING LAYER ============ -->
  <text x="40" y="480" font-size="12" font-weight="600" fill="#6b7280">03 // 处理层</text>

  <!-- Retrieval -->
  <g transform="translate(80, 460)">
    <rect x="0" y="0" width="100" height="50" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="50" y="20" text-anchor="middle" font-size="12" font-weight="500" fill="#111827">检索</text>
    <text x="50" y="38" text-anchor="middle" font-size="10" fill="#6b7280">库存检索</text>
  </g>

  <!-- Stock Check -->
  <g transform="translate(220, 460)">
    <rect x="0" y="0" width="100" height="50" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
    <text x="50" y="20" text-anchor="middle" font-size="12" font-weight="500" fill="#111827">库存检查</text>
    <text x="50" y="38" text-anchor="middle" font-size="10" fill="#6b7280">库存验证</text>
  </g>

  <!-- Pick Service -->
  <g transform="translate(360, 460)">
    <rect x="0" y="0" width="100" height="50" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="50" y="20" text-anchor="middle" font-size="12" font-weight="500" fill="#111827">领料服务</text>
    <text x="50" y="38" text-anchor="middle" font-size="10" fill="#6b7280">生成单据</text>
  </g>

  <!-- ============ DATA LAYER ============ -->
  <text x="40" y="580" font-size="12" font-weight="600" fill="#6b7280">04 // 数据层</text>

  <!-- Materials DB -->
  <g transform="translate(80, 560)">
    <path d="M20,0 L80,0 L80,45 L20,45 Z" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
    <path d="M20,0 Q20,15 50,15 Q80,15 80,0" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
    <path d="M20,15 Q20,30 50,30 Q80,30 80,15" fill="none" stroke="#6b7280" stroke-width="1"/>
    <path d="M20,30 Q20,45 50,45 Q80,45 80,30" fill="none" stroke="#6b7280" stroke-width="1"/>
    <text x="50" y="65" text-anchor="middle" font-size="11" fill="#111827">物料主数据</text>
  </g>

  <!-- Inventory DB -->
  <g transform="translate(200, 560)">
    <path d="M20,0 L80,0 L80,45 L20,45 Z" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <path d="M20,0 Q20,15 50,15 Q80,15 80,0" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <path d="M20,15 Q20,30 50,30 Q80,30 80,15" fill="none" stroke="#16a34a" stroke-width="1"/>
    <path d="M20,30 Q20,45 50,45 Q80,45 80,30" fill="none" stroke="#16a34a" stroke-width="1"/>
    <text x="50" y="65" text-anchor="middle" font-size="11" fill="#111827">实时库存</text>
  </g>

  <!-- Pick Records -->
  <g transform="translate(320, 560)">
    <path d="M20,0 L80,0 L80,45 L20,45 Z" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <path d="M20,0 Q20,15 50,15 Q80,15 80,0" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <path d="M20,15 Q20,30 50,30 Q80,30 80,15" fill="none" stroke="#dc2626" stroke-width="1"/>
    <path d="M20,30 Q20,45 50,45 Q80,45 80,30" fill="none" stroke="#dc2626" stroke-width="1"/>
    <text x="50" y="65" text-anchor="middle" font-size="11" fill="#111827">领料记录</text>
  </g>

  <!-- ============ ARROWS ============ -->
  <!-- User to Query -->
  <path d="M170,130 L240,215" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#arrow-blue)"/>

  <!-- Query to Embedding -->
  <path d="M300,255 L300,275" stroke="#9333ea" stroke-width="1.5" fill="none" marker-end="url(#arrow-purple)"/>

  <!-- Embedding to Vector Store -->
  <path d="M300,335 L270,355" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#arrow-blue)"/>

  <!-- Vector Store to Inventory KB -->
  <path d="M360,385 L375,385" stroke="#16a34a" stroke-width="1.5" fill="none" marker-end="url(#arrow-green)"/>

  <!-- Retrieval to Stock Check -->
  <path d="M180,510 L215,485" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#arrow-blue)"/>

  <!-- Stock Check to Pick Service -->
  <path d="M320,485 L355,485" stroke="#ea580c" stroke-width="1.5" fill="none" marker-end="url(#arrow-orange)"/>

  <!-- Stock Check to Materials DB -->
  <path d="M220,510 L120,555" stroke="#ea580c" stroke-width="1.5" fill="none" marker-end="url(#arrow-orange)"/>

  <!-- Stock Check to Inventory DB -->
  <path d="M270,510 L250,555" stroke="#ea580c" stroke-width="1.5" fill="none" marker-end="url(#arrow-orange)"/>

  <!-- Pick Service to Pick Records -->
  <path d="M410,510 L350,555" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#arrow-red)"/>

  <!-- Pick Service to Inventory DB (update) -->
  <path d="M410,490 L250,565" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,3" fill="none" marker-end="url(#arrow-red)"/>

  <!-- ============ LEGEND ============ -->
  <g transform="translate(600, 520)">
    <rect x="0" y="0" width="280" height="130" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
    <text x="15" y="25" font-size="12" font-weight="600" fill="#111827">图例 Legend</text>
    <line x1="15" y1="45" x2="45" y2="45" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
    <text x="55" y="49" font-size="11" fill="#6b7280">用户请求</text>
    <line x1="15" y1="65" x2="45" y2="65" stroke="#9333ea" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
    <text x="55" y="69" font-size="11" fill="#6b7280">向量化处理</text>
    <line x1="15" y1="85" x2="45" y2="85" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
    <text x="55" y="89" font-size="11" fill="#6b7280">知识检索</text>
    <line x1="150" y1="45" x2="180" y2="45" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
    <text x="190" y="49" font-size="11" fill="#6b7280">库存检查</text>
    <line x1="150" y1="65" x2="180" y2="65" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>
    <text x="190" y="69" font-size="11" fill="#6b7280">领料更新</text>
    <line x1="150" y1="85" x2="180" y2="85" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-red)"/>
    <text x="190" y="89" font-size="11" fill="#6b7280">数据更新</text>
  </g>

  <!-- RAG Flow Description -->
  <g transform="translate(600, 200)">
    <rect x="0" y="0" width="280" height="180" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="15" y="25" font-size="12" font-weight="600" fill="#111827">RAG 检索流程</text>
    <text x="15" y="50" font-size="11" fill="#6b7280">1. 用户提交领料申请</text>
    <text x="15" y="70" font-size="11" fill="#6b7280">2. Query处理器解析请求</text>
    <text x="15" y="90" font-size="11" fill="#6b7280">3. Embedding模型向量化</text>
    <text x="15" y="110" font-size="11" fill="#6b7280">4. 库存向量库相似性检索</text>
    <text x="15" y="130" font-size="11" fill="#6b7280">5. 获取相关库存上下文</text>
    <text x="15" y="150" font-size="11" fill="#6b7280">6. 库存检查与验证</text>
    <text x="15" y="170" font-size="11" fill="#6b7280">7. 生成领料单据/更新库存</text>
  </g>
</svg>