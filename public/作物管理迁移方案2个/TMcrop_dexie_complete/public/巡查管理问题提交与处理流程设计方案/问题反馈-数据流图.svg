<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 750" width="1100" height="750">
  <style>
    text { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
  </style>
  <defs>
    <marker id="a-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <marker id="a-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#16a34a"/>
    </marker>
    <marker id="a-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#9333ea"/>
    </marker>
    <marker id="a-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ea580c"/>
    </marker>
    <marker id="a-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#dc2626"/>
    </marker>
    <marker id="a-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="1100" height="750" fill="#ffffff"/>

  <!-- Title -->
  <text x="550" y="35" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">问题反馈订单数据流图</text>

  <!-- ========== ROW 1: Input ========== -->
  <text x="50" y="85" font-size="12" font-weight="600" fill="#6b7280">输入层</text>

  <!-- 巡查记录 -->
  <g transform="translate(50, 100)">
    <rect x="0" y="0" width="150" height="60" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="75" y="25" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">巡查记录</text>
    <text x="75" y="45" text-anchor="middle" font-size="10" fill="#6b7280">InspectionRecord</text>
  </g>

  <!-- 问题描述 -->
  <g transform="translate(230, 100)">
    <rect x="0" y="0" width="130" height="60" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="65" y="25" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">问题描述</text>
    <text x="65" y="45" text-anchor="middle" font-size="10" fill="#6b7280">issueText</text>
  </g>

  <!-- 严重程度 -->
  <g transform="translate(230, 180)">
    <rect x="0" y="0" width="130" height="45" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
    <text x="65" y="18" text-anchor="middle" font-size="12" font-weight="500" fill="#111827">严重程度</text>
    <text x="65" y="35" text-anchor="middle" font-size="10" fill="#6b7280">轻微/中等/严重</text>
  </g>

  <!-- Arrow: 巡查记录 → 问题描述 -->
  <path d="M200,130 L220,130" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>

  <!-- Arrow: 问题描述 → 严重程度 -->
  <path d="M295,160 L295,180" stroke="#ea580c" stroke-width="1.5" fill="none" marker-end="url(#a-orange)"/>

  <!-- ========== ROW 2: Problem Creation ========== -->
  <text x="50" y="275" font-size="12" font-weight="600" fill="#6b7280">问题生成层</text>

  <!-- ProblemEntry -->
  <g transform="translate(150, 290)">
    <rect x="0" y="0" width="170" height="80" rx="6" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
    <text x="85" y="22" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">ProblemEntry</text>
    <text x="85" y="40" text-anchor="middle" font-size="10" fill="#6b7280">问题记录实体</text>
    <line x1="10" y1="48" x2="160" y2="48" stroke="#e5e7eb" stroke-width="1"/>
    <text x="85" y="63" text-anchor="middle" font-size="10" fill="#9333ea">problemCode</text>
    <text x="85" y="75" text-anchor="middle" font-size="10" fill="#6b7280">status: 待处理</text>
  </g>

  <!-- 编号生成器 -->
  <g transform="translate(50, 310)">
    <rect x="0" y="0" width="80" height="40" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="40" y="17" text-anchor="middle" font-size="11" font-weight="500" fill="#111827">编号生成</text>
    <text x="40" y="32" text-anchor="middle" font-size="9" fill="#6b7280">PD+日期</text>
  </g>

  <!-- Arrow: 编号生成器 → ProblemEntry -->
  <path d="M130,330 L145,330" stroke="#16a34a" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>

  <!-- Arrow: 问题描述 → ProblemEntry (水平) -->
  <path d="M360,130 L360,250 L330,250 L330,290" stroke="#9333ea" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>

  <!-- Arrow: 严重程度 → ProblemEntry -->
  <path d="M295,225 L295,260 L320,260 L320,290" stroke="#ea580c" stroke-width="1.5" fill="none" marker-end="url(#a-orange)"/>

  <!-- ========== ROW 3: Dispatch ========== -->
  <text x="50" y="420" font-size="12" font-weight="600" fill="#6b7280">分派层</text>

  <!-- 问题分派 -->
  <g transform="translate(50, 435)">
    <rect x="0" y="0" width="150" height="70" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="75" y="22" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">问题分派</text>
    <text x="75" y="40" text-anchor="middle" font-size="10" fill="#6b7280">dispatchProblem()</text>
    <line x1="10" y1="48" x2="140" y2="48" stroke="#e5e7eb" stroke-width="1"/>
    <text x="75" y="62" text-anchor="middle" font-size="10" fill="#ea580c">待处理→处理中</text>
  </g>

  <!-- Task任务 -->
  <g transform="translate(230, 435)">
    <rect x="0" y="0" width="150" height="70" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="75" y="22" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">Task 任务</text>
    <text x="75" y="40" text-anchor="middle" font-size="10" fill="#6b7280">关联任务</text>
    <line x1="10" y1="48" x2="140" y2="48" stroke="#e5e7eb" stroke-width="1"/>
    <text x="75" y="62" text-anchor="middle" font-size="10" fill="#2563eb">taskCode</text>
  </g>

  <!-- 执行人 -->
  <g transform="translate(410, 450)">
    <rect x="0" y="0" width="90" height="45" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="45" y="18" text-anchor="middle" font-size="11" font-weight="500" fill="#111827">执行人</text>
    <text x="45" y="35" text-anchor="middle" font-size="10" fill="#6b7280">assignee</text>
  </g>

  <!-- Arrow: ProblemEntry → 问题分派 -->
  <path d="M235,370 L235,435" stroke="#9333ea" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>

  <!-- Arrow: 问题分派 → Task -->
  <path d="M200,470 L220,470" stroke="#ea580c" stroke-width="1.5" fill="none" marker-end="url(#a-orange)"/>

  <!-- Arrow: Task → 执行人 -->
  <path d="M380,470 L400,472" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- ========== ROW 4: Handle ========== -->
  <text x="50" y="555" font-size="12" font-weight="600" fill="#6b7280">处理层</text>

  <!-- 接单 -->
  <g transform="translate(50, 570)">
    <rect x="0" y="0" width="80" height="45" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="40" y="18" text-anchor="middle" font-size="11" font-weight="500" fill="#111827">接单</text>
    <text x="40" y="35" text-anchor="middle" font-size="10" fill="#6b7280">accept</text>
  </g>

  <!-- 开始处理 -->
  <g transform="translate(150, 570)">
    <rect x="0" y="0" width="90" height="45" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="45" y="18" text-anchor="middle" font-size="11" font-weight="500" fill="#111827">开始处理</text>
    <text x="45" y="35" text-anchor="middle" font-size="10" fill="#6b7280">start</text>
  </g>

  <!-- 提交反馈 -->
  <g transform="translate(260, 570)">
    <rect x="0" y="0" width="90" height="45" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
    <text x="45" y="18" text-anchor="middle" font-size="11" font-weight="500" fill="#111827">提交反馈</text>
    <text x="45" y="35" text-anchor="middle" font-size="10" fill="#6b7280">submit</text>
  </g>

  <!-- 记录进度 -->
  <g transform="translate(370, 570)">
    <rect x="0" y="0" width="90" height="45" rx="6" fill="#faf5ff" stroke="#9333ea" stroke-width="1.5"/>
    <text x="45" y="18" text-anchor="middle" font-size="11" font-weight="500" fill="#111827">记录进度</text>
    <text x="45" y="35" text-anchor="middle" font-size="10" fill="#6b7280">progress</text>
  </g>

  <!-- Arrow: 执行人 → 接单 -->
  <path d="M455,472 L455,560 L130,592" stroke="#16a34a" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>

  <!-- Arrow: 接单 → 开始处理 -->
  <path d="M130,592 L145,592" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Arrow: 开始处理 → 提交反馈 -->
  <path d="M240,592 L255,592" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#a-blue)"/>

  <!-- Arrow: 提交反馈 → 记录进度 -->
  <path d="M350,592 L365,592" stroke="#ea580c" stroke-width="1.5" fill="none" marker-end="url(#a-orange)"/>

  <!-- ========== RIGHT SIDE: Accept & Storage ========== -->
  <!-- 验收通过 -->
  <g transform="translate(550, 100)">
    <rect x="0" y="0" width="110" height="55" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="55" y="23" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">验收通过</text>
    <text x="55" y="42" text-anchor="middle" font-size="10" fill="#6b7280">approve</text>
  </g>

  <!-- 返工 -->
  <g transform="translate(550, 175)">
    <rect x="0" y="0" width="110" height="55" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="55" y="23" text-anchor="middle" font-size="13" font-weight="600" fill="#111827">返工</text>
    <text x="55" y="42" text-anchor="middle" font-size="10" fill="#6b7280">reject</text>
  </g>

  <!-- LocalStorage -->
  <g transform="translate(550, 280)">
    <ellipse cx="55" cy="22" rx="50" ry="22" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
    <line x1="5" y1="22" x2="105" y2="22" stroke="#6b7280" stroke-width="1"/>
    <text x="55" y="55" text-anchor="middle" font-size="11" fill="#111827">LocalStorage</text>
  </g>

  <!-- FlowRecords -->
  <g transform="translate(550, 360)">
    <ellipse cx="55" cy="22" rx="50" ry="22" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <line x1="5" y1="22" x2="105" y2="22" stroke="#2563eb" stroke-width="1"/>
    <text x="55" y="55" text-anchor="middle" font-size="11" fill="#111827">流转记录</text>
  </g>

  <!-- Arrow: 记录进度 → 验收通过 -->
  <path d="M460,592 L550,592 L550,127" stroke="#16a34a" stroke-width="1.5" fill="none" marker-end="url(#a-green)"/>

  <!-- Arrow: 验收通过 → 返工 -->
  <path d="M605,155 L605,175" stroke="#dc2626" stroke-width="1.5" fill="none" marker-end="url(#a-red)"/>

  <!-- Arrow: 返工 → 问题分派 (虚线退回) -->
  <path d="M550,210 L500,210 L500,470 L200,470" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6,3" fill="none" marker-end="url(#a-red)"/>

  <!-- Arrow: ProblemEntry → LocalStorage -->
  <path d="M320,330 L500,330 L550,302" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#a-gray)"/>

  <!-- Arrow: Task → FlowRecords -->
  <path d="M380,480 L500,480 L550,382" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,2" fill="none"/>

  <!-- ========== LEGEND ========== -->
  <g transform="translate(700, 100)">
    <rect x="0" y="0" width="220" height="250" rx="6" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="15" y="25" font-size="13" font-weight="600" fill="#111827">图例</text>

    <line x1="15" y1="50" x2="50" y2="50" stroke="#2563eb" stroke-width="2" marker-end="url(#a-blue)"/>
    <text x="60" y="55" font-size="11" fill="#6b7280">主数据流</text>

    <line x1="15" y1="80" x2="50" y2="80" stroke="#16a34a" stroke-width="2" marker-end="url(#a-green)"/>
    <text x="60" y="85" font-size="11" fill="#6b7280">状态更新</text>

    <line x1="15" y1="110" x2="50" y2="110" stroke="#9333ea" stroke-width="2" marker-end="url(#a-purple)"/>
    <text x="60" y="115" font-size="11" fill="#6b7280">问题创建</text>

    <line x1="15" y1="140" x2="50" y2="140" stroke="#ea580c" stroke-width="2" marker-end="url(#a-orange)"/>
    <text x="60" y="145" font-size="11" fill="#6b7280">分派/处理</text>

    <line x1="15" y1="170" x2="50" y2="170" stroke="#dc2626" stroke-width="2" marker-end="url(#a-red)"/>
    <text x="60" y="175" font-size="11" fill="#6b7280">返工/异常</text>

    <line x1="15" y1="200" x2="50" y2="200" stroke="#6b7280" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="60" y="205" font-size="11" fill="#6b7280">异步/存储</text>

    <line x1="15" y1="230" x2="50" y2="230" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#a-red)"/>
    <text x="60" y="235" font-size="11" fill="#6b7280">返工退回</text>
  </g>

  <!-- Status Flow -->
  <g transform="translate(700, 380)">
    <rect x="0" y="0" width="220" height="180" rx="6" fill="#fef2f2" stroke="#fecaca"/>
    <text x="15" y="25" font-size="12" font-weight="600" fill="#991b1b">状态流转</text>

    <text x="15" y="55" font-size="10" fill="#6b7280">待处理 → 分派</text>
    <text x="15" y="75" font-size="10" fill="#6b7280">→ 处理中 → 提交反馈</text>
    <text x="15" y="95" font-size="10" fill="#6b7280">→ 待验收 → 验收通过</text>
    <text x="15" y="115" font-size="10" fill="#6b7280">→ 已处理</text>

    <line x1="15" y1="135" x2="200" y2="135" stroke="#e5e7eb"/>
    <text x="15" y="155" font-size="10" fill="#dc2626">返工规则:</text>
    <text x="15" y="170" font-size="10" fill="#dc2626">第1次: 原执行人继续</text>
    <text x="15" y="185" font-size="10" fill="#dc2626">第2次: 退回重新分派</text>
  </g>
</svg>
