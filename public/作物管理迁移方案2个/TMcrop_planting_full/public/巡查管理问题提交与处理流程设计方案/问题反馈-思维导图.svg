<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850">
  <style>
    text { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
  </style>
  <defs>
    <marker id="a-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
