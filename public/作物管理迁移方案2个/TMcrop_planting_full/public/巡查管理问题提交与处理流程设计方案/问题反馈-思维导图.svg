  <g transform="translate(600, 350)">
    <rect x="-45" y="-18" width="90" height="36" rx="18" fill="#cffafe" stroke="#0891b2" stroke-width="1.5"/>
    <text x="0" y="5" text-anchor="middle" font-size="11" font-weight="600" fill="#0e7490">问题类型</text>
  </g>

  <!-- Sub-nodes -->
  <path d="M555,365 Q480,400 400,450" stroke="#22d3ee" stroke-width="1.5" fill="none" marker-end="url(#a-cyan)"/>
  <g transform="translate(360, 470)">
