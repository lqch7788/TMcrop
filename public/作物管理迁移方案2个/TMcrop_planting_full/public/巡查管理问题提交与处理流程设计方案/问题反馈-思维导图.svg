    <rect x="-50" y="-18" width="100" height="36" rx="18" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
    <text x="0" y="5" text-anchor="middle" font-size="11" font-weight="600" fill="#7e22ce">问题关闭</text>
  </g>

  <!-- Sub-nodes -->
  <path d="M980,310 Q1040,340 1100,385" stroke="#c084fc" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
  <g transform="translate(1130, 405)">
    <rect x="-35" y="-14" width="70" height="28" rx="14" fill="#faf5ff" stroke="#c084fc"/>
    <text x="0" y="5" text-anchor="middle" font-size="10" fill="#7e22ce">已处理</text>
  </g>

  <path d="M980,310 Q1000,350 980,395" stroke="#c084fc" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
  <g transform="translate(960, 415)">
    <rect x="-60" y="-14" width="120" height="28" rx="14" fill="#faf5ff" stroke="#c084fc"/>
    <text x="0" y="5" text-anchor="middle" font-size="10" fill="#7e22ce">flowRecords更新</text>
  </g>

  <path d="M980,310 Q940,350 910,395" stroke="#c084fc" stroke-width="1.5" fill="none" marker-end="url(#a-purple)"/>
  <g transform="translate(860, 415)">
    <rect x="-45" y="-14" width="90" height="28" rx="14" fill="#faf5ff" stroke="#c084fc"/>
    <text x="0" y="5" text-anchor="middle" font-size="10" fill="#7e22ce">保存记录</text>
  </g>

