  <g transform="translate(150, 415)">
    <rect x="-40" y="-14" width="80" height="28" rx="14" fill="#fef2f2" stroke="#f87171"/>
    <text x="0" y="5" text-anchor="middle" font-size="10" fill="#b91c1c">返工规则</text>
  </g>

