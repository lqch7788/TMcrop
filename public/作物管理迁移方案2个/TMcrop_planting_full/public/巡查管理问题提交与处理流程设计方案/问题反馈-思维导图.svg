  <g transform="translate(490, 490)">
    <rect x="-30" y="-14" width="60" height="28" rx="14" fill="#ecfeff" stroke="#22d3ee"/>
    <text x="0" y="5" text-anchor="middle" font-size="10" fill="#0e7490">环境</text>
  </g>

  <path d="M600,386 Q600,440 600,490" stroke="#22d3ee" stroke-width="1.5" fill="none" marker-end="url(#a-cyan)"/>
  <g transform="translate(600, 510)">
    <rect x="-30" y="-14" width="60" height="28" rx="14" fill="#ecfeff" stroke="#22d3ee"/>
    <text x="0" y="5" text-anchor="middle" font-size="10" fill="#0e7490">水肥</text>
  </g>

  <path d="M645,365 Q720,400 800,450" stroke="#22d3ee" stroke-width="1.5" fill="none" marker-end="url(#a-cyan)"/>
  <g transform="translate(840, 470)">
    <rect x="-30" y="-14" width="60" height="28" rx="14" fill="#ecfeff" stroke="#22d3ee"/>
    <text x="0" y="5" text-anchor="middle" font-size="10" fill="#0e7490">其他</text>
  </g>

  <path d="M645,365 Q670,420 690,470" stroke="#22d3ee" stroke-width="1.5" fill="none" marker-end="url(#a-cyan)"/>
  <g transform="translate(710, 490)">
    <rect x="-30" y="-14" width="60" height="28" rx="14" fill="#ecfeff" stroke="#22d3ee"/>
    <text x="0" y="5" text-anchor="middle" font-size="10" fill="#0e7490">设备</text>
  </g>

  <!-- ========== LEGEND (BOTTOM LEFT) ========== -->
  <g transform="translate(50, 560)">
    <rect x="0" y="0" width="180" height="160" rx="6" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="15" y="22" font-size="11" font-weight="600" fill="#111827">图例</text>

    <circle cx="25" cy="45" r="10" fill="#7c3aed"/>
    <text x="45" y="50" font-size="10" fill="#6b7280">中心主题</text>

    <rect x="12" y="62" width="25" height="16" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
    <text x="45" y="74" font-size="10" fill="#6b7280">一级分支</text>

    <rect x="12" y="88" width="25" height="14" rx="7" fill="#f3e8ff" stroke="#a78bfa"/>
    <text x="45" y="98" font-size="10" fill="#6b7280">二级分支</text>

    <line x1="12" y1="120" x2="40" y2="120" stroke="#7c3aed" stroke-width="2" marker-end="url(#a-purple)"/>
    <text x="50" y="124" font-size="10" fill="#6b7280">连接线</text>
  </g>

  <!-- ========== KEY RULES (BOTTOM CENTER) ========== -->
  <g transform="translate(260, 560)">
    <rect x="0" y="0" width="220" height="160" rx="6" fill="#fef2f2" stroke="#fecaca"/>
    <text x="15" y="22" font-size="11" font-weight="600" fill="#991b1b">业务规则</text>

    <text x="15" y="45" font-size="10" fill="#6b7280">问题生成条件:</text>
    <text x="15" y="60" font-size="10" fill="#6b7280">feedbackRequired=true</text>
    <text x="15" y="73" font-size="10" fill="#6b7280">+ feedbackUsers.length>0</text>
    <text x="15" y="86" font-size="10" fill="#6b7280">+ inspectionResult≠normal</text>

    <text x="15" y="108" font-size="10" fill="#6b7280">问题编号: PD+日期+序号</text>
    <text x="15" y="126" font-size="10" fill="#6b7280">严重程度截止日期:</text>
    <text x="15" y="140" font-size="10" fill="#6b7280">严重=1天, 中等=3天, 轻微=7天</text>
    <text x="15" y="156" font-size="10" fill="#dc2626">返工: 第1次给原执行人</text>
  </g>

  <!-- ========== STATUS FLOW (BOTTOM RIGHT) ========== -->
  <g transform="translate(510, 560)">
    <rect x="0" y="0" width="240" height="160" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="15" y="22" font-size="11" font-weight="600" fill="#1e40af">状态流转</text>

    <g transform="translate(15, 40)">
      <rect x="0" y="0" width="55" height="24" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
      <text x="27" y="16" text-anchor="middle" font-size="9" fill="#b45309">待处理</text>

      <line x1="60" y1="12" x2="80" y2="12" stroke="#16a34a" stroke-width="2" marker-end="url(#a-green)"/>

      <rect x="85" y="0" width="55" height="24" rx="4" fill="#dbeafe" stroke="#2563eb"/>
      <text x="112" y="16" text-anchor="middle" font-size="9" fill="#1d4ed8">处理中</text>
    </g>

    <g transform="translate(15, 75)">
      <line x1="27" y1="-5" x2="27" y2="10" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a-green)"/>

      <rect x="0" y="0" width="55" height="24" rx="4" fill="#ede9fe" stroke="#9333ea"/>
      <text x="27" y="16" text-anchor="middle" font-size="9" fill="#7e22ce">待验收</text>

      <line x1="60" y1="12" x2="80" y2="12" stroke="#16a34a" stroke-width="2" marker-end="url(#a-green)"/>

      <rect x="85" y="0" width="55" height="24" rx="4" fill="#dcfce7" stroke="#16a34a"/>
      <text x="112" y="16" text-anchor="middle" font-size="9" fill="#15803d">已处理</text>
    </g>

    <text x="15" y="125" font-size="10" fill="#dc2626">返工退回: 第2次返工退回调派</text>
    <text x="15" y="145" font-size="10" fill="#6b7280">ProblemEntry: problemCode, status</text>
  </g>

  <!-- ========== DATA MODELS (FAR RIGHT) ========== -->
  <g transform="translate(780, 560)">
    <rect x="0" y="0" width="220" height="160" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="15" y="22" font-size="11" font-weight="600" fill="#166534">核心数据模型</text>

    <text x="15" y="45" font-size="10" fill="#6b7280">ProblemEntry:</text>
    <text x="15" y="60" font-size="10" fill="#6b7280">  id, problemCode, greenhouseId</text>
    <text x="15" y="74" font-size="10" fill="#6b7280">  cropName, inspectorName</text>
    <text x="15" y="88" font-size="10" fill="#6b7280">  issueSeverity, status, handler</text>
    <text x="15" y="102" font-size="10" fill="#6b7280">  flowRecords</text>

    <text x="15" y="126" font-size="10" fill="#6b7280">Task:</text>
    <text x="15" y="140" font-size="10" fill="#6b7280">  id, problemId, executorId</text>
    <text x="15" y="154" font-size="10" fill="#6b7280">  expectedCompletionTime</text>
  </g>
</svg>
