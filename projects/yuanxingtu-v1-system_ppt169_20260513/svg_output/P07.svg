<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="1280" height="720" fill="#FFFFFF"/>

  <!-- 顶部装饰条 -->
  <rect x="0" y="0" width="1280" height="6" fill="#10B981"/>

  <!-- 章节标题 -->
  <text x="80" y="80" font-family="Microsoft YaHei, Arial" font-size="36" font-weight="bold" fill="#1F2937">02</text>
  <text x="160" y="75" font-family="Microsoft YaHei, Arial" font-size="28" font-weight="bold" fill="#1F2937">农事管理模块详解</text>
  <rect x="80" y="95" width="100" height="3" fill="#10B981"/>

  <!-- 模块概述 -->
  <g transform="translate(80, 130)">
    <rect width="1120" height="80" rx="10" fill="#ECFDF5"/>
    <text x="30" y="30" font-family="Microsoft YaHei, Arial" font-size="16" font-weight="bold" fill="#1F2937">模块概述</text>
    <text x="30" y="55" font-family="Microsoft YaHei, Arial" font-size="13" fill="#4B5563">农事管理模块是农业生产执行的核心模块，包含任务中心、巡查记录、问题管理、每日工单、智能派发等功能，实现农事作业的精细化管理。</text>
  </g>

  <!-- 功能模块详情 -->
  <g transform="translate(80, 230)">
    <!-- 第一行 -->
    <g transform="translate(0, 0)">
      <rect width="350" height="180" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
      <rect x="0" y="0" width="350" height="40" rx="10" fill="#10B981"/>
      <rect x="0" y="30" width="350" height="10" fill="#10B981"/>
      <text x="175" y="28" font-family="Microsoft YaHei, Arial" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">任务中心</text>
      <text x="20" y="70" font-family="Microsoft YaHei, Arial" font-size="13" fill="#374151">• 农事任务统一管理</text>
      <text x="20" y="95" font-family="Microsoft YaHei, Arial" font-size="13" fill="#374151">• 任务创建、编辑、删除</text>
      <text x="20" y="120" font-family="Microsoft YaHei, Arial" font-size="13" fill="#374151">• 任务状态实时跟踪</text>
      <text x="20" y="145" font-family="Microsoft YaHei, Arial" font-size="13" fill="#374151">• 批量导入导出</text>
    </g>

    <g transform="translate(385, 0)">
      <rect width="350" height="180" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="2"/>
      <rect x="0" y="0" width="350" height="40" rx="10" fill="#059669"/>
      <rect x="0" y="30" width="350" height="10" fill="#059669"/>
      <text x="175" y="28" font-family="Microsoft YaHei, Arial" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">巡查记录</text>
      <text x="20" y="70" font-family="Microsoft YaHei, Arial" font-size="13" fill="#374151">• 巡检路线规划</text>
      <text x="20" y="95" font-family="Microsoft YaHei, Arial" font-size="13" fill="#374151">• 巡查点签到打卡</text>
      <text x="20" y="120" font-family="Microsoft YaHei, Arial" font-size="13" fill="#374151">• 异常情况拍照记录</text>
      <text x="20" y="145" font-family="Microsoft YaHei, Arial" font-size="13" fill="#374151">• 巡查报告自动生成</text>
    </g>

    <g transform="translate(770, 0)">
      <rect width="350" height="180" rx="10" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
      <rect x="0" y="0" width="350" height="40" rx="10" fill="#F59E0B"/>
      <rect x="0" y="30" width="350" height="10" fill="#F59E0B"/>
      <text x="175" y="28" font-family="Microsoft YaHei, Arial" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">问题管理</text>
      <text x="20" y="70" font-family="Microsoft YaHei, Arial" font-size="13" fill="#374151">• 问题上报与分类</text>
      <text x="20" y="95" font-family="Microsoft YaHei, Arial" font-size="13" fill="#374151">• 处理状态流转</text>
      <text x="20" y="120" font-family="Microsoft YaHei, Arial" font-size="13" fill="#374151">• 责任人分派</text>
      <text x="20" y="145" font-family="Microsoft YaHei, Arial" font-size="13" fill="#374151">• 处理结果验收</text>
    </g>
  </g>

  <!-- 第二行 -->
  <g transform="translate(80, 430)">
    <g transform="translate(0, 0)">
      <rect width="260" height="180" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/>
      <rect x="0" y="0" width="260" height="40" rx="10" fill="#3B82F6"/>
      <rect x="0" y="30" width="260" height="10" fill="#3B82F6"/>
      <text x="130" y="28" font-family="Microsoft YaHei, Arial" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">每日工单</text>
      <text x="15" y="70" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 日计划自动生成工单</text>
      <text x="15" y="95" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 工单执行确认</text>
      <text x="15" y="120" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 完成情况汇总</text>
      <text x="15" y="145" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 工时统计</text>
    </g>

    <g transform="translate(290, 0)">
      <rect width="260" height="180" rx="10" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="2"/>
      <rect x="0" y="0" width="260" height="40" rx="10" fill="#8B5CF6"/>
      <rect x="0" y="30" width="260" height="10" fill="#8B5CF6"/>
      <text x="130" y="28" font-family="Microsoft YaHei, Arial" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">智能派发</text>
      <text x="15" y="70" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 地块位置智能分配</text>
      <text x="15" y="95" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 人员技能匹配</text>
      <text x="15" y="120" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 工作量均衡分配</text>
      <text x="15" y="145" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 派发记录追溯</text>
    </g>

    <g transform="translate(580, 0)">
      <rect width="260" height="180" rx="10" fill="#FFFFFF" stroke="#EC4899" stroke-width="2"/>
      <rect x="0" y="0" width="260" height="40" rx="10" fill="#EC4899"/>
      <rect x="0" y="30" width="260" height="10" fill="#EC4899"/>
      <text x="130" y="28" font-family="Microsoft YaHei, Arial" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">问题分派</text>
      <text x="15" y="70" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 问题等级分类</text>
      <text x="15" y="95" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 处理时限设置</text>
      <text x="15" y="120" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 催办提醒机制</text>
      <text x="15" y="145" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 超时自动升级</text>
    </g>

    <g transform="translate(870, 0)">
      <rect width="260" height="180" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
      <rect x="0" y="0" width="260" height="40" rx="10" fill="#10B981"/>
      <rect x="0" y="30" width="260" height="10" fill="#10B981"/>
      <text x="130" y="28" font-family="Microsoft YaHei, Arial" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">数据统计</text>
      <text x="15" y="70" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 任务完成率统计</text>
      <text x="15" y="95" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 问题分类分析</text>
      <text x="15" y="120" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 人员绩效排名</text>
      <text x="15" y="145" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 趋势图表展示</text>
    </g>
  </g>
</svg>
