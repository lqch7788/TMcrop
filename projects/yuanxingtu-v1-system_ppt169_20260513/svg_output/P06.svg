<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="1280" height="720" fill="#FFFFFF"/>

  <!-- 顶部装饰条 -->
  <rect x="0" y="0" width="1280" height="6" fill="#10B981"/>

  <!-- 章节标题 -->
  <text x="80" y="80" font-family="Microsoft YaHei, Arial" font-size="36" font-weight="bold" fill="#1F2937">02</text>
  <text x="160" y="75" font-family="Microsoft YaHei, Arial" font-size="28" font-weight="bold" fill="#1F2937">作物管理模块详解</text>
  <rect x="80" y="95" width="100" height="3" fill="#10B981"/>

  <!-- 模块概述 -->
  <g transform="translate(80, 130)">
    <rect width="1120" height="80" rx="10" fill="#ECFDF5"/>
    <text x="30" y="30" font-family="Microsoft YaHei, Arial" font-size="16" font-weight="bold" fill="#1F2937">模块概述</text>
    <text x="30" y="55" font-family="Microsoft YaHei, Arial" font-size="13" fill="#4B5563">作物管理模块覆盖从种源到采收的全生命周期，包括种源管理、育苗管理、种植管理、采收入库、作物库存和实例追溯，实现农产品质量全程可追溯。</text>
  </g>

  <!-- 功能模块详情 -->
  <g transform="translate(80, 230)">
    <!-- 第一行 -->
    <g transform="translate(0, 0)">
      <rect width="350" height="180" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="2"/>
      <rect x="0" y="0" width="350" height="40" rx="10" fill="#059669"/>
      <rect x="0" y="30" width="350" height="10" fill="#059669"/>
      <text x="175" y="28" font-family="Microsoft YaHei, Arial" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">种源管理</text>
      <text x="20" y="70" font-family="Microsoft YaHei, Arial" font-size="13" fill="#374151">• 种子档案建立与维护</text>
      <text x="20" y="95" font-family="Microsoft YaHei, Arial" font-size="13" fill="#374151">• 供应商及来源地记录</text>
      <text x="20" y="120" font-family="Microsoft YaHei, Arial" font-size="13" fill="#374151">• 种子质量检验信息</text>
      <text x="20" y="145" font-family="Microsoft YaHei, Arial" font-size="13" fill="#374151">• 库存余量预警</text>
    </g>

    <g transform="translate(385, 0)">
      <rect width="350" height="180" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
      <rect x="0" y="0" width="350" height="40" rx="10" fill="#10B981"/>
      <rect x="0" y="30" width="350" height="10" fill="#10B981"/>
      <text x="175" y="28" font-family="Microsoft YaHei, Arial" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">育苗管理</text>
      <text x="20" y="70" font-family="Microsoft YaHei, Arial" font-size="13" fill="#374151">• 育苗计划制定</text>
      <text x="20" y="95" font-family="Microsoft YaHei, Arial" font-size="13" fill="#374151">• 温室环境监控</text>
      <text x="20" y="120" font-family="Microsoft YaHei, Arial" font-size="13" fill="#374151">• 生长周期记录</text>
      <text x="20" y="145" font-family="Microsoft YaHei, Arial" font-size="13" fill="#374151">• 壮苗标准判定</text>
    </g>

    <g transform="translate(770, 0)">
      <rect width="350" height="180" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="2"/>
      <rect x="0" y="0" width="350" height="40" rx="10" fill="#059669"/>
      <rect x="0" y="30" width="350" height="10" fill="#059669"/>
      <text x="175" y="28" font-family="Microsoft YaHei, Arial" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">种植管理</text>
      <text x="20" y="70" font-family="Microsoft YaHei, Arial" font-size="13" fill="#374151">• 地块种植记录</text>
      <text x="20" y="95" font-family="Microsoft YaHei, Arial" font-size="13" fill="#374151">• 生长数据采集</text>
      <text x="20" y="120" font-family="Microsoft YaHei, Arial" font-size="13" fill="#374151">• 农事操作关联</text>
      <text x="20" y="145" font-family="Microsoft YaHei, Arial" font-size="13" fill="#374151">• 环境数据记录</text>
    </g>
  </g>

  <!-- 第二行 -->
  <g transform="translate(80, 430)">
    <g transform="translate(0, 0)">
      <rect width="260" height="180" rx="10" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
      <rect x="0" y="0" width="260" height="40" rx="10" fill="#F59E0B"/>
      <rect x="0" y="30" width="260" height="10" fill="#F59E0B"/>
      <text x="130" y="28" font-family="Microsoft YaHei, Arial" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">采收入库</text>
      <text x="15" y="70" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 采收批次登记</text>
      <text x="15" y="95" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 质量检验评级</text>
      <text x="15" y="120" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 库存入库操作</text>
      <text x="15" y="145" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 采收统计分析</text>
    </g>

    <g transform="translate(290, 0)">
      <rect width="260" height="180" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/>
      <rect x="0" y="0" width="260" height="40" rx="10" fill="#3B82F6"/>
      <rect x="0" y="30" width="260" height="10" fill="#3B82F6"/>
      <text x="130" y="28" font-family="Microsoft YaHei, Arial" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">作物库存</text>
      <text x="15" y="70" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 库存台账管理</text>
      <text x="15" y="95" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 出库登记与追溯</text>
      <text x="15" y="120" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 库存盘点功能</text>
      <text x="15" y="145" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 保质期预警</text>
    </g>

    <g transform="translate(580, 0)">
      <rect width="260" height="180" rx="10" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="2"/>
      <rect x="0" y="0" width="260" height="40" rx="10" fill="#8B5CF6"/>
      <rect x="0" y="30" width="260" height="10" fill="#8B5CF6"/>
      <text x="130" y="28" font-family="Microsoft YaHei, Arial" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">实例追溯</text>
      <text x="15" y="70" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 批次二维码生成</text>
      <text x="15" y="95" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 全流程信息查询</text>
      <text x="15" y="120" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 扫码快速追溯</text>
      <text x="15" y="145" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 质量问题定位</text>
    </g>

    <g transform="translate(870, 0)">
      <rect width="260" height="180" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="2"/>
      <rect x="0" y="0" width="260" height="40" rx="10" fill="#059669"/>
      <rect x="0" y="30" width="260" height="10" fill="#059669"/>
      <text x="130" y="28" font-family="Microsoft YaHei, Arial" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">统计分析</text>
      <text x="15" y="70" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 产量统计分析</text>
      <text x="15" y="95" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 品质分布报表</text>
      <text x="15" y="120" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 种植效益分析</text>
      <text x="15" y="145" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 趋势预测模型</text>
    </g>
  </g>
</svg>
