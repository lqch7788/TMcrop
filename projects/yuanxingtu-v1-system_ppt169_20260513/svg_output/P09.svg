<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="1280" height="720" fill="#FFFFFF"/>

  <!-- 顶部装饰条 -->
  <rect x="0" y="0" width="1280" height="6" fill="#10B981"/>

  <!-- 章节标题 -->
  <text x="80" y="80" font-family="Microsoft YaHei, Arial" font-size="36" font-weight="bold" fill="#1F2937">02</text>
  <text x="160" y="75" font-family="Microsoft YaHei, Arial" font-size="28" font-weight="bold" fill="#1F2937">库存管理模块详解</text>
  <rect x="80" y="95" width="100" height="3" fill="#10B981"/>

  <!-- 模块概述 -->
  <g transform="translate(80, 130)">
    <rect width="1120" height="80" rx="10" fill="#ECFDF5"/>
    <text x="30" y="30" font-family="Microsoft YaHei, Arial" font-size="16" font-weight="bold" fill="#1F2937">模块概述</text>
    <text x="30" y="55" font-family="Microsoft YaHei, Arial" font-size="13" fill="#4B5563">库存管理模块实现农业生产资料的全程管理，包括库存总览、物料入库、生产领料、生产退料、供应商管理和物料分类，保障物资供应顺畅。</text>
  </g>

  <!-- 功能模块详情 -->
  <g transform="translate(80, 230)">
    <!-- 第一行 -->
    <g transform="translate(0, 0)">
      <rect width="350" height="180" rx="10" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
      <rect x="0" y="0" width="350" height="40" rx="10" fill="#F59E0B"/>
      <rect x="0" y="30" width="350" height="10" fill="#F59E0B"/>
      <text x="175" y="28" font-family="Microsoft YaHei, Arial" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">库存总览</text>
      <text x="20" y="70" font-family="Microsoft YaHei, Arial" font-size="13" fill="#374151">• 库存资产总览看板</text>
      <text x="20" y="95" font-family="Microsoft YaHei, Arial" font-size="13" fill="#374151">• 分类库存统计</text>
      <text x="20" y="120" font-family="Microsoft YaHei, Arial" font-size="13" fill="#374151">• 库存预警提醒</text>
      <text x="20" y="145" font-family="Microsoft YaHei, Arial" font-size="13" fill="#374151">• 库存周转分析</text>
    </g>

    <g transform="translate(385, 0)">
      <rect width="350" height="180" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
      <rect x="0" y="0" width="350" height="40" rx="10" fill="#10B981"/>
      <rect x="0" y="30" width="350" height="10" fill="#10B981"/>
      <text x="175" y="28" font-family="Microsoft YaHei, Arial" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">物料入库</text>
      <text x="20" y="70" font-family="Microsoft YaHei, Arial" font-size="13" fill="#374151">• 入库单据管理</text>
      <text x="20" y="95" font-family="Microsoft YaHei, Arial" font-size="13" fill="#374151">• 采购订单关联</text>
      <text x="20" y="120" font-family="Microsoft YaHei, Arial" font-size="13" fill="#374151">• 质量检验登记</text>
      <text x="20" y="145" font-family="Microsoft YaHei, Arial" font-size="13" fill="#374151">• 入库历史查询</text>
    </g>

    <g transform="translate(770, 0)">
      <rect width="350" height="180" rx="10" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
      <rect x="0" y="0" width="350" height="40" rx="10" fill="#F59E0B"/>
      <rect x="0" y="30" width="350" height="10" fill="#F59E0B"/>
      <text x="175" y="28" font-family="Microsoft YaHei, Arial" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">生产领料</text>
      <text x="20" y="70" font-family="Microsoft YaHei, Arial" font-size="13" fill="#374151">• 领料申请审批</text>
      <text x="20" y="95" font-family="Microsoft YaHei, Arial" font-size="13" fill="#374151">• 生产批次关联</text>
      <text x="20" y="120" font-family="Microsoft YaHei, Arial" font-size="13" fill="#374151">• 限额领料控制</text>
      <text x="20" y="145" font-family="Microsoft YaHei, Arial" font-size="13" fill="#374151">• 领料明细记录</text>
    </g>
  </g>

  <!-- 第二行 -->
  <g transform="translate(80, 430)">
    <g transform="translate(0, 0)">
      <rect width="260" height="180" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/>
      <rect x="0" y="0" width="260" height="40" rx="10" fill="#3B82F6"/>
      <rect x="0" y="30" width="260" height="10" fill="#3B82F6"/>
      <text x="130" y="28" font-family="Microsoft YaHei, Arial" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">生产退料</text>
      <text x="15" y="70" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 退料申请登记</text>
      <text x="15" y="95" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 退料原因记录</text>
      <text x="15" y="120" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 物料重新入库</text>
      <text x="15" y="145" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 损耗处理管理</text>
    </g>

    <g transform="translate(290, 0)">
      <rect width="260" height="180" rx="10" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="2"/>
      <rect x="0" y="0" width="260" height="40" rx="10" fill="#8B5CF6"/>
      <rect x="0" y="30" width="260" height="10" fill="#8B5CF6"/>
      <text x="130" y="28" font-family="Microsoft YaHei, Arial" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">供应商管理</text>
      <text x="15" y="70" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 供应商档案维护</text>
      <text x="15" y="95" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 供应物料清单</text>
      <text x="15" y="120" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 供货价格管理</text>
      <text x="15" y="145" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 供应商评价</text>
    </g>

    <g transform="translate(580, 0)">
      <rect width="260" height="180" rx="10" fill="#FFFFFF" stroke="#EC4899" stroke-width="2"/>
      <rect x="0" y="0" width="260" height="40" rx="10" fill="#EC4899"/>
      <rect x="0" y="30" width="260" height="10" fill="#EC4899"/>
      <text x="130" y="28" font-family="Microsoft YaHei, Arial" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">物料分类</text>
      <text x="15" y="70" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 物料类别配置</text>
      <text x="15" y="95" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 计量单位管理</text>
      <text x="15" y="120" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 安全库存设置</text>
      <text x="15" y="145" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 规格型号管理</text>
    </g>

    <g transform="translate(870, 0)">
      <rect width="260" height="180" rx="10" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
      <rect x="0" y="0" width="260" height="40" rx="10" fill="#F59E0B"/>
      <rect x="0" y="30" width="260" height="10" fill="#F59E0B"/>
      <text x="130" y="28" font-family="Microsoft YaHei, Arial" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">库存盘点</text>
      <text x="15" y="70" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 盘点计划制定</text>
      <text x="15" y="95" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 盘点数据录入</text>
      <text x="15" y="120" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 盈亏差异分析</text>
      <text x="15" y="145" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 盘点报告生成</text>
    </g>
  </g>
</svg>
