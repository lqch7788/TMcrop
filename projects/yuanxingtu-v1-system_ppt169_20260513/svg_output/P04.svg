      <text x="20" y="60" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 任务中心</text>
      <text x="20" y="80" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 巡查记录</text>
      <text x="20" y="100" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 问题管理</text>
      <text x="140" y="60" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 每日工单</text>
