      <text x="20" y="80" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 物料入库</text>
      <text x="20" y="100" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 生产领料</text>
      <text x="140" y="60" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 生产退料</text>
