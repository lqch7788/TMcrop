      <text x="20" y="60" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 种源管理</text>
      <text x="20" y="80" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 育苗管理</text>
      <text x="20" y="100" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 种植管理</text>
      <text x="140" y="60" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 采收入库</text>
      <text x="140" y="80" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 作物库存</text>
      <text x="140" y="100" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 实例追溯</text>
