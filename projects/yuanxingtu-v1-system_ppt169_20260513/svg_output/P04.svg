      <text x="130" y="30" font-family="Microsoft YaHei, Arial" font-size="18" font-weight="bold" fill="#10B981" text-anchor="middle">计划管理</text>
      <text x="20" y="60" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 生产计划</text>
      <text x="20" y="80" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 技术方案</text>
      <text x="20" y="100" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 采购计划</text>
      <text x="140" y="60" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 订单管理</text>
      <text x="140" y="80" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 月度计划</text>
      <text x="140" y="100" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 每日计划</text>
