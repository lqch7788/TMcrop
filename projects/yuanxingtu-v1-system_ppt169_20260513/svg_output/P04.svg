      <text x="20" y="60" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 权限配置</text>
      <text x="20" y="80" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 角色管理</text>
      <text x="20" y="100" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 字典管理</text>
      <text x="140" y="60" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 审批流程配置</text>
