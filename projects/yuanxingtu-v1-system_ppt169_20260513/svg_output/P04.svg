  <text x="100" y="510" font-family="Microsoft YaHei, Arial" font-size="16" font-weight="bold" fill="#1F2937">系统特色</text>
  <g transform="translate(100, 540)">
    <text x="0" y="0" font-family="Microsoft YaHei, Arial" font-size="13" fill="#4B5563">✓ 模块化设计，各模块独立又协同</text>
    <text x="350" y="0" font-family="Microsoft YaHei, Arial" font-size="13" fill="#4B5563">✓ 审批流程灵活可配置</text>
    <text x="650" y="0" font-family="Microsoft YaHei, Arial" font-size="13" fill="#4B5563">✓ 任务全生命周期管理</text>
  </g>
  <g transform="translate(100, 570)">
    <text x="0" y="0" font-family="Microsoft YaHei, Arial" font-size="13" fill="#4B5563">✓ 数据实时同步，本地优先</text>
    <text x="350" y="0" font-family="Microsoft YaHei, Arial" font-size="13" fill="#4B5563">✓ 支持离线使用</text>
    <text x="650" y="0" font-family="Microsoft YaHei, Arial" font-size="13" fill="#4B5563">✓ 完整操作日志审计</text>
