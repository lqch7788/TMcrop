      <text x="20" y="100" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 农事审批</text>
      <text x="140" y="60" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 指标预算审批</text>
