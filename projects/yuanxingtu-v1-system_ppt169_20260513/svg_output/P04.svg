      <text x="20" y="60" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 考勤管理</text>
      <text x="20" y="80" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 人事管理</text>
      <text x="20" y="100" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 薪酬管理</text>
      <text x="140" y="60" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 运营分析</text>
