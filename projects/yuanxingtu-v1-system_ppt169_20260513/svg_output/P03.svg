<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="1280" height="720" fill="#FFFFFF"/>

  <!-- 顶部装饰条 -->
  <rect x="0" y="0" width="1280" height="6" fill="#10B981"/>

  <!-- 章节标题 -->
  <text x="80" y="80" font-family="Microsoft YaHei, Arial" font-size="36" font-weight="bold" fill="#1F2937">01</text>
  <text x="160" y="75" font-family="Microsoft YaHei, Arial" font-size="28" font-weight="bold" fill="#1F2937">系统概述</text>
  <rect x="80" y="95" width="100" height="3" fill="#10B981"/>

  <!-- 系统定位 -->
  <g transform="translate(80, 140)">
    <rect width="540" height="200" rx="10" fill="#F3F4F6"/>
    <text x="30" y="35" font-family="Microsoft YaHei, Arial" font-size="20" font-weight="bold" fill="#1F2937">系统定位</text>
    <text x="30" y="65" font-family="Microsoft YaHei, Arial" font-size="14" fill="#4B5563">
      <tspan x="30" dy="0">农业种植管理系统是一款面向现代农业生产的数字化管理平台，</tspan>
      <tspan x="30" dy="22">集生产计划、作物管理、农事任务、库存管理、人工管理、</tspan>
      <tspan x="30" dy="22">审批流程于一体的综合管理系统。</tspan>
    </text>
    <text x="30" y="160" font-family="Microsoft YaHei, Arial" font-size="14" fill="#6B7280">核心价值：提升农业生产效率、降低运营成本、实现全程可追溯</text>
  </g>

  <!-- 核心价值 -->
  <g transform="translate(660, 140)">
    <rect width="540" height="200" rx="10" fill="#ECFDF5"/>
    <text x="30" y="35" font-family="Microsoft YaHei, Arial" font-size="20" font-weight="bold" fill="#1F2937">核心价值</text>
    <g transform="translate(30, 60)">
      <g transform="translate(0, 0)">
        <circle cx="12" cy="12" r="12" fill="#10B981"/>
        <text x="12" y="16" font-family="Microsoft YaHei, Arial" font-size="12" fill="#FFFFFF" text-anchor="middle">1</text>
        <text x="35" y="10" font-family="Microsoft YaHei, Arial" font-size="14" font-weight="bold" fill="#1F2937">数字化管理</text>
        <text x="35" y="28" font-family="Microsoft YaHei, Arial" font-size="12" fill="#6B7280">全流程数字化管控</text>
      </g>
      <g transform="translate(0, 50)">
        <circle cx="12" cy="12" r="12" fill="#10B981"/>
        <text x="12" y="16" font-family="Microsoft YaHei, Arial" font-size="12" fill="#FFFFFF" text-anchor="middle">2</text>
        <text x="35" y="10" font-family="Microsoft YaHei, Arial" font-size="14" font-weight="bold" fill="#1F2937">智能决策</text>
        <text x="35" y="28" font-family="Microsoft YaHei, Arial" font-size="12" fill="#6B7280">数据驱动科学决策</text>
      </g>
      <g transform="translate(0, 100)">
        <circle cx="12" cy="12" r="12" fill="#10B981"/>
        <text x="12" y="16" font-family="Microsoft YaHei, Arial" font-size="12" fill="#FFFFFF" text-anchor="middle">3</text>
        <text x="35" y="10" font-family="Microsoft YaHei, Arial" font-size="14" font-weight="bold" fill="#1F2937">全程追溯</text>
        <text x="35" y="28" font-family="Microsoft YaHei, Arial" font-size="12" fill="#6B7280">农产品质量可追溯</text>
      </g>
    </g>
  </g>

  <!-- 技术架构 -->
  <g transform="translate(80, 370)">
    <rect width="1120" height="300" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
    <text x="30" y="35" font-family="Microsoft YaHei, Arial" font-size="20" font-weight="bold" fill="#1F2937">技术架构</text>

    <!-- 前端 -->
    <g transform="translate(50, 70)">
      <rect width="200" height="180" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
      <text x="100" y="30" font-family="Microsoft YaHei, Arial" font-size="16" font-weight="bold" fill="#10B981" text-anchor="middle">前端</text>
      <text x="100" y="60" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151" text-anchor="middle">React 18 + TypeScript</text>
      <text x="100" y="85" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151" text-anchor="middle">Vite + Tailwind CSS</text>
      <text x="100" y="110" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151" text-anchor="middle">TanStack Query</text>
      <text x="100" y="135" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151" text-anchor="middle">React Router v6</text>
      <text x="100" y="160" font-family="Microsoft YaHei, Arial" font-size="12" fill="#6B7280" text-anchor="middle">Radix UI</text>
    </g>

    <!-- 箭头 -->
    <path d="M270 160 L300 160" stroke="#10B981" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
        <path d="M0,0 L0,6 L9,3 z" fill="#10B981"/>
      </marker>
    </defs>

    <!-- 后端 -->
    <g transform="translate(320, 70)">
      <rect width="200" height="180" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
      <text x="100" y="30" font-family="Microsoft YaHei, Arial" font-size="16" font-weight="bold" fill="#F59E0B" text-anchor="middle">后端</text>
      <text x="100" y="60" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151" text-anchor="middle">Express + TypeScript</text>
      <text x="100" y="85" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151" text-anchor="middle">SQLite (sql.js)</text>
      <text x="100" y="110" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151" text-anchor="middle">Zod 数据验证</text>
      <text x="100" y="135" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151" text-anchor="middle">CORS 跨域支持</text>
    </g>

    <!-- 箭头 -->
    <path d="M540 160 L570 160" stroke="#F59E0B" stroke-width="2" fill="none" marker-end="url(#arrow2)"/>
    <defs>
      <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
        <path d="M0,0 L0,6 L9,3 z" fill="#F59E0B"/>
      </marker>
    </defs>

    <!-- 数据库 -->
    <g transform="translate(590, 70)">
      <rect width="200" height="180" rx="8" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
      <text x="100" y="30" font-family="Microsoft YaHei, Arial" font-size="16" font-weight="bold" fill="#3B82F6" text-anchor="middle">数据库</text>
      <text x="100" y="60" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151" text-anchor="middle">SQLite</text>
      <text x="100" y="85" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151" text-anchor="middle">本地文件存储</text>
      <text x="100" y="110" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151" text-anchor="middle">支持JSON扩展</text>
      <text x="100" y="160" font-family="Microsoft YaHei, Arial" font-size="11" fill="#6B7280" text-anchor="middle">yuanxingtu.db</text>
    </g>

    <!-- 箭头 -->
    <path d="M810 160 L840 160" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#arrow3)"/>
    <defs>
      <marker id="arrow3" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
        <path d="M0,0 L0,6 L9,3 z" fill="#3B82F6"/>
      </marker>
    </defs>

    <!-- 部署 -->
    <g transform="translate(860, 70)">
      <rect width="200" height="180" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
      <text x="100" y="30" font-family="Microsoft YaHei, Arial" font-size="16" font-weight="bold" fill="#6B7280" text-anchor="middle">部署模式</text>
      <text x="100" y="60" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151" text-anchor="middle">前端: Vite Dev Server</text>
      <text x="100" y="85" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151" text-anchor="middle">后端: Node.js</text>
      <text x="100" y="110" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151" text-anchor="middle">端口: 5188 / 3001</text>
      <text x="100" y="135" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151" text-anchor="middle">API代理: /api</text>
    </g>
  </g>
</svg>
