<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="1280" height="720" fill="#FFFFFF"/>

  <!-- 顶部装饰条 -->
  <rect x="0" y="0" width="1280" height="6" fill="#10B981"/>

  <!-- 章节标题 -->
  <text x="80" y="80" font-family="Microsoft YaHei, Arial" font-size="36" font-weight="bold" fill="#1F2937">02</text>
  <text x="160" y="75" font-family="Microsoft YaHei, Arial" font-size="28" font-weight="bold" fill="#1F2937">计划管理模块详解</text>
  <rect x="80" y="95" width="100" height="3" fill="#10B981"/>

  <!-- 模块概述 -->
  <g transform="translate(80, 130)">
    <rect width="1120" height="80" rx="10" fill="#ECFDF5"/>
    <text x="30" y="30" font-family="Microsoft YaHei, Arial" font-size="16" font-weight="bold" fill="#1F2937">模块概述</text>
    <text x="30" y="55" font-family="Microsoft YaHei, Arial" font-size="13" fill="#4B5563">计划管理模块负责农业生产全流程的计划制定与跟踪，包括生产计划、技术方案、采购计划、订单管理、月度计划和每日计划，为农业生产提供有序的规划保障。</text>
  </g>

  <!-- 功能模块详情 -->
  <g transform="translate(80, 230)">
    <!-- 第一行 -->
    <g transform="translate(0, 0)">
      <rect width="350" height="180" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
      <rect x="0" y="0" width="350" height="40" rx="10" fill="#10B981"/>
      <rect x="0" y="30" width="350" height="10" fill="#10B981"/>
      <text x="175" y="28" font-family="Microsoft YaHei, Arial" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">生产计划</text>
      <text x="20" y="70" font-family="Microsoft YaHei, Arial" font-size="13" fill="#374151">• 年度/季度/月度生产计划制定</text>
      <text x="20" y="95" font-family="Microsoft YaHei, Arial" font-size="13" fill="#374151">• 地块分配与种植面积规划</text>
      <text x="20" y="120" font-family="Microsoft YaHei, Arial" font-size="13" fill="#374151">• 作物轮作计划安排</text>
      <text x="20" y="145" font-family="Microsoft YaHei, Arial" font-size="13" fill="#374151">• 计划执行进度跟踪</text>
    </g>

    <g transform="translate(385, 0)">
      <rect width="350" height="180" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="2"/>
      <rect x="0" y="0" width="350" height="40" rx="10" fill="#059669"/>
      <rect x="0" y="30" width="350" height="10" fill="#059669"/>
      <text x="175" y="28" font-family="Microsoft YaHei, Arial" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">技术方案</text>
      <text x="20" y="70" font-family="Microsoft YaHei, Arial" font-size="13" fill="#374151">• 种植技术方案模板管理</text>
      <text x="20" y="95" font-family="Microsoft YaHei, Arial" font-size="13" fill="#374151">• 作业指导书配置</text>
      <text x="20" y="120" font-family="Microsoft YaHei, Arial" font-size="13" fill="#374151">• 病虫害防治方案</text>
      <text x="20" y="145" font-family="Microsoft YaHei, Arial" font-size="13" fill="#374151">• 施肥灌溉技术参数</text>
    </g>

    <g transform="translate(770, 0)">
      <rect width="350" height="180" rx="10" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
      <rect x="0" y="0" width="350" height="40" rx="10" fill="#F59E0B"/>
      <rect x="0" y="30" width="350" height="10" fill="#F59E0B"/>
      <text x="175" y="28" font-family="Microsoft YaHei, Arial" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">采购计划</text>
      <text x="20" y="70" font-family="Microsoft YaHei, Arial" font-size="13" fill="#374151">• 种子、肥料、农药采购计划</text>
      <text x="20" y="95" font-family="Microsoft YaHei, Arial" font-size="13" fill="#374151">• 农机设备采购申请</text>
      <text x="20" y="120" font-family="Microsoft YaHei, Arial" font-size="13" fill="#374151">• 采购审批流程</text>
      <text x="20" y="145" font-family="Microsoft YaHei, Arial" font-size="13" fill="#374151">• 供应商比价管理</text>
    </g>
  </g>

  <!-- 第二行 -->
  <g transform="translate(80, 430)">
    <g transform="translate(0, 0)">
      <rect width="260" height="180" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/>
      <rect x="0" y="0" width="260" height="40" rx="10" fill="#3B82F6"/>
      <rect x="0" y="30" width="260" height="10" fill="#3B82F6"/>
      <text x="130" y="28" font-family="Microsoft YaHei, Arial" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">订单管理</text>
      <text x="15" y="70" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 销售订单录入</text>
      <text x="15" y="95" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 订单状态跟踪</text>
      <text x="15" y="120" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 交付计划排定</text>
      <text x="15" y="145" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 订单数据分析</text>
    </g>

    <g transform="translate(290, 0)">
      <rect width="260" height="180" rx="10" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="2"/>
      <rect x="0" y="0" width="260" height="40" rx="10" fill="#8B5CF6"/>
      <rect x="0" y="30" width="260" height="10" fill="#8B5CF6"/>
      <text x="130" y="28" font-family="Microsoft YaHei, Arial" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">月度计划</text>
      <text x="15" y="70" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 月度任务分解</text>
      <text x="15" y="95" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 资源需求预测</text>
      <text x="15" y="120" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 完成情况统计</text>
      <text x="15" y="145" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 偏差分析调整</text>
    </g>

    <g transform="translate(580, 0)">
      <rect width="260" height="180" rx="10" fill="#FFFFFF" stroke="#EC4899" stroke-width="2"/>
      <rect x="0" y="0" width="260" height="40" rx="10" fill="#EC4899"/>
      <rect x="0" y="30" width="260" height="10" fill="#EC4899"/>
      <text x="130" y="28" font-family="Microsoft YaHei, Arial" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">每日计划</text>
      <text x="15" y="70" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 每日任务派发</text>
      <text x="15" y="95" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 农事安排调度</text>
      <text x="15" y="120" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 人员考勤关联</text>
      <text x="15" y="145" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 完成情况日报</text>
    </g>

    <g transform="translate(870, 0)">
      <rect width="260" height="180" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
      <rect x="0" y="0" width="260" height="40" rx="10" fill="#10B981"/>
      <rect x="0" y="30" width="260" height="10" fill="#10B981"/>
      <text x="130" y="28" font-family="Microsoft YaHei, Arial" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">数据统计</text>
      <text x="15" y="70" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 计划完成率分析</text>
      <text x="15" y="95" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 甘特图展示</text>
      <text x="15" y="120" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 导出打印功能</text>
      <text x="15" y="145" font-family="Microsoft YaHei, Arial" font-size="12" fill="#374151">• 历史数据对比</text>
    </g>
  </g>
</svg>
