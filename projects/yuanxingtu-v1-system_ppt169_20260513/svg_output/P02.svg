<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="1280" height="720" fill="#FFFFFF"/>

  <!-- 顶部装饰条 -->
  <rect x="0" y="0" width="1280" height="6" fill="#10B981"/>

  <!-- 标题 -->
  <text x="80" y="80" font-family="Microsoft YaHei, Arial" font-size="36" font-weight="bold" fill="#1F2937">目录</text>
  <text x="80" y="110" font-family="Microsoft YaHei, Arial" font-size="16" fill="#6B7280">CONTENTS</text>

  <!-- 分隔线 -->
  <rect x="80" y="130" width="120" height="3" fill="#10B981"/>

  <!-- 目录项 -->
  <g transform="translate(80, 180)">
    <!-- 01 系统概述 -->
    <g transform="translate(0, 0)">
      <text x="0" y="30" font-family="Microsoft YaHei, Arial" font-size="48" font-weight="bold" fill="#10B981">01</text>
      <text x="80" y="20" font-family="Microsoft YaHei, Arial" font-size="22" font-weight="bold" fill="#1F2937">系统概述</text>
      <text x="80" y="45" font-family="Microsoft YaHei, Arial" font-size="14" fill="#6B7280">系统定位、核心价值、技术架构</text>
      <line x1="0" y1="65" x2="400" y2="65" stroke="#E5E7EB" stroke-width="1"/>
    </g>

    <!-- 02 功能模块 -->
    <g transform="translate(0, 90)">
      <text x="0" y="30" font-family="Microsoft YaHei, Arial" font-size="48" font-weight="bold" fill="#10B981">02</text>
      <text x="80" y="20" font-family="Microsoft YaHei, Arial" font-size="22" font-weight="bold" fill="#1F2937">功能模块详解</text>
      <text x="80" y="45" font-family="Microsoft YaHei, Arial" font-size="14" fill="#6B7280">计划管理、作物管理、农事管理、人工管理、库存管理、审批中心</text>
      <line x1="0" y1="65" x2="400" y2="65" stroke="#E5E7EB" stroke-width="1"/>
    </g>

    <!-- 03 业务流程 -->
    <g transform="translate(0, 180)">
      <text x="0" y="30" font-family="Microsoft YaHei, Arial" font-size="48" font-weight="bold" fill="#10B981">03</text>
      <text x="80" y="20" font-family="Microsoft YaHei, Arial" font-size="22" font-weight="bold" fill="#1F2937">业务流程详解</text>
      <text x="80" y="45" font-family="Microsoft YaHei, Arial" font-size="14" fill="#6B7280">审批流程、任务流转、数据流、生产批次流程</text>
      <line x1="0" y1="65" x2="400" y2="65" stroke="#E5E7EB" stroke-width="1"/>
    </g>

    <!-- 04 数据架构 -->
    <g transform="translate(0, 270)">
      <text x="0" y="30" font-family="Microsoft YaHei, Arial" font-size="48" font-weight="bold" fill="#10B981">04</text>
      <text x="80" y="20" font-family="Microsoft YaHei, Arial" font-size="22" font-weight="bold" fill="#1F2937">数据架构</text>
      <text x="80" y="45" font-family="Microsoft YaHei, Arial" font-size="14" fill="#6B7280">数据库表结构、API接口设计</text>
      <line x1="0" y1="65" x2="400" y2="65" stroke="#E5E7EB" stroke-width="1"/>
    </g>

    <!-- 05 系统总结 -->
    <g transform="translate(0, 360)">
      <text x="0" y="30" font-family="Microsoft YaHei, Arial" font-size="48" font-weight="bold" fill="#10B981">05</text>
      <text x="80" y="20" font-family="Microsoft YaHei, Arial" font-size="22" font-weight="bold" fill="#1F2937">系统特性总结</text>
      <text x="80" y="45" font-family="Microsoft YaHei, Arial" font-size="14" fill="#6B7280">核心优势、系统特点、联系方式</text>
    </g>
  </g>

  <!-- 右侧装饰 -->
  <g transform="translate(900, 150)">
    <rect width="280" height="450" rx="10" fill="#F3F4F6"/>
    <text x="30" y="50" font-family="Microsoft YaHei, Arial" font-size="18" font-weight="bold" fill="#1F2937">模块清单</text>

    <g transform="translate(30, 80)">
      <circle cx="8" cy="8" r="8" fill="#10B981"/>
      <text x="30" y="12" font-family="Microsoft YaHei, Arial" font-size="14" fill="#374151">计划管理</text>
    </g>
    <g transform="translate(30, 115)">
      <circle cx="8" cy="8" r="8" fill="#059669"/>
      <text x="30" y="12" font-family="Microsoft YaHei, Arial" font-size="14" fill="#374151">作物管理</text>
    </g>
    <g transform="translate(30, 150)">
      <circle cx="8" cy="8" r="8" fill="#10B981"/>
      <text x="30" y="12" font-family="Microsoft YaHei, Arial" font-size="14" fill="#374151">农事管理</text>
    </g>
    <g transform="translate(30, 185)">
      <circle cx="8" cy="8" r="8" fill="#059669"/>
      <text x="30" y="12" font-family="Microsoft YaHei, Arial" font-size="14" fill="#374151">人工管理</text>
    </g>
    <g transform="translate(30, 220)">
      <circle cx="8" cy="8" r="8" fill="#10B981"/>
      <text x="30" y="12" font-family="Microsoft YaHei, Arial" font-size="14" fill="#374151">库存管理</text>
    </g>
    <g transform="translate(30, 255)">
      <circle cx="8" cy="8" r="8" fill="#059669"/>
      <text x="30" y="12" font-family="Microsoft YaHei, Arial" font-size="14" fill="#374151">审批中心</text>
    </g>
    <g transform="translate(30, 290)">
      <circle cx="8" cy="8" r="8" fill="#10B981"/>
      <text x="30" y="12" font-family="Microsoft YaHei, Arial" font-size="14" fill="#374151">生产汇总</text>
    </g>
    <g transform="translate(30, 325)">
      <circle cx="8" cy="8" r="8" fill="#059669"/>
      <text x="30" y="12" font-family="Microsoft YaHei, Arial" font-size="14" fill="#374151">系统设置</text>
    </g>
  </g>
</svg>
